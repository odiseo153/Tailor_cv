<script>
(function() {
  const scene = document.getElementById('scene-1');
  const tl = gsap.timeline({ paused: true });
  
  tl.from('.pain-icon', {
    scale: 0.5,
    opacity: 0,
    duration: 0.6,
    ease: 'back.out(1.7)'
  }, 0.2);

  }, 0.5);

  }, 0.8);

    opacity: 0,
    duration: 0.5,
    ease: 'power2.out'
  }, 1.2);
  
  tl.from('#stat-seconds', {
    y: 30,
    opacity: 0,
    duration: 0.5,
    ease: 'power2.out'
  }, 1.35);
  
  tl.from('#stat-ats', {
    x: 30,
    opacity: 0,
    duration: 0.5,
    ease: 'power2.out'
  }, 1.5);
  
  window.__timelines = window.__timelines || {};
  window.__timelines['scene-1'] = tl;
})();
