.scene-7 {

}

.bg-particles {

}

.particle-dot {

  height: 4px;
  background: #00d4ff;

.logo-final {

}

.logo-glow {

  border-radius: 50%;
  animation: glow-pulse 3s ease-in-out infinite;
}

<script>
(function() {
  const container = document.getElementById('particles-container');
  for (let i = 0; i < 30; i++) {
    const dot = document.createElement('div');
    dot.className = 'particle-dot';
    dot.style.left = Math.random() * 100 + '%';
    dot.style.top = Math.random() * 100 + 100 + '%';
    dot.style.animationDelay = Math.random() * 8 + 's';

    dot.style.width = (2 + Math.random() * 4) + 'px';
    dot.style.height = dot.style.width;
    container.appendChild(dot);
  }
  
  const tl = gsap.timeline({ paused: true });
  
  tl.from('.logo-final', {
    scale: 0.3,
    opacity: 0,
    duration: 1,
    ease: 'back.out(1.5)'
  }, 0);
  
  tl.from('.final-cta-text', {
    y: 40,
    opacity: 0,
    duration: 0.8,
    ease: 'power3.out'
  }, 1.2);
  
  tl.from('.final-cta-btn', {
    scale: 0.8,
    opacity: 0,
    duration: 0.6,
    ease: 'back.out(1.5)'
  }, 1.8);
  
  tl.from('.social-proof', {
    y: 20,
    opacity: 0,
    duration: 0.5,
    ease: 'power2.out'
  }, 2.2);
  
  window.__timelines = window.__timelines || {};
  window.__timelines['scene-7'] = tl;
})();
